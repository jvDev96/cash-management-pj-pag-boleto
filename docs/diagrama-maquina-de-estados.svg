<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-label="Diagrama de maquina de estados com 8 estados: Recebido, Validado, Saldo Reservado, Liquidacao Enviada e Concluido no caminho feliz; Rejeitado, Saldo Liberado e Falhou nos caminhos de falha e compensacao.">
  <style>
    text{font-family:'IBM Plex Mono','Courier New',monospace;fill:#211D16;}
    .box{fill:#EAE3D0;stroke:#D7CDB2;stroke-width:1.5;}
    .box-good{fill:#DCEBDF;stroke:#3C7A52;stroke-width:2.5;}
    .box-bad{fill:#F3DFD9;stroke:#AC3A2A;stroke-width:2.5;}
    .box-warn{fill:#EFE3C2;stroke:#9C7A1E;stroke-width:2.5;}
    .lbl{font-size:12.5px;font-weight:600;}
    .lbl-good{fill:#3C7A52;}
    .lbl-bad{fill:#AC3A2A;}
    .lbl-warn{fill:#9C7A1E;}
    .path-good{stroke:#3C7A52;fill:none;}
    .path-bad{stroke:#AC3A2A;fill:none;stroke-dasharray:5 3;}
    .path-warn{stroke:#9C7A1E;fill:none;}
    .cap{fill:#6E6656;font-size:10.5px;font-family:'IBM Plex Sans',Arial,sans-serif;}
  </style>
  <rect width="980" height="420" fill="#F2EEE2"/>
  <defs>
    <marker id="mg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3C7A52"/></marker>
    <marker id="mb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#AC3A2A"/></marker>
    <marker id="mw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9C7A1E"/></marker>
  </defs>

  <rect x="20" y="30" width="140" height="52" rx="8" class="box"/>
  <text x="90" y="61" text-anchor="middle" class="lbl">RECEBIDO</text>

  <rect x="215" y="30" width="140" height="52" rx="8" class="box"/>
  <text x="285" y="61" text-anchor="middle" class="lbl">VALIDADO</text>

  <rect x="410" y="30" width="160" height="52" rx="8" class="box"/>
  <text x="490" y="61" text-anchor="middle" class="lbl" style="font-size:11.5px">SALDO_RESERVADO</text>

  <rect x="620" y="30" width="170" height="52" rx="8" class="box"/>
  <text x="705" y="61" text-anchor="middle" class="lbl" style="font-size:11px">LIQUIDACAO_ENVIADA</text>

  <rect x="840" y="30" width="130" height="52" rx="8" class="box-good"/>
  <text x="905" y="61" text-anchor="middle" class="lbl lbl-good">CONCLUIDO</text>

  <line x1="160" y1="56" x2="210" y2="56" class="path-good" marker-end="url(#mg)"/>
  <line x1="355" y1="56" x2="405" y2="56" class="path-good" marker-end="url(#mg)"/>
  <line x1="570" y1="56" x2="615" y2="56" class="path-good" marker-end="url(#mg)"/>
  <line x1="790" y1="56" x2="835" y2="56" class="path-good" marker-end="url(#mg)"/>

  <rect x="215" y="180" width="140" height="52" rx="8" class="box-bad"/>
  <text x="285" y="211" text-anchor="middle" class="lbl lbl-bad">REJEITADO</text>

  <path d="M90 82 L90 130 L280 130 L280 178" class="path-bad" marker-end="url(#mb)"/>
  <text x="95" y="145" class="cap">boleto não encontrado</text>

  <path d="M285 82 L285 178" class="path-bad" marker-end="url(#mb)"/>
  <text x="292" y="130" class="cap">saldo insuficiente</text>

  <rect x="620" y="180" width="170" height="52" rx="8" class="box-warn"/>
  <text x="705" y="205" text-anchor="middle" class="lbl lbl-warn" style="font-size:11px">SALDO_LIBERADO</text>
  <text x="705" y="221" text-anchor="middle" class="cap">(compensação)</text>

  <path d="M490 82 L490 155 L705 155 L705 178" class="path-warn" marker-end="url(#mw)"/>
  <text x="495" y="150" class="cap">falha na liquidação → compensa</text>

  <path d="M705 82 L705 178" class="path-warn" marker-end="url(#mw)"/>

  <path d="M620 206 L285 206 L285 232" class="path-bad" marker-end="url(#mb)"/>

  <rect x="620" y="330" width="170" height="52" rx="8" class="box-bad"/>
  <text x="705" y="361" text-anchor="middle" class="lbl lbl-bad">FALHOU</text>

  <path d="M705 232 L705 328" class="path-bad" marker-end="url(#mb)"/>
  <text x="712" y="285" class="cap">saldo já liberado, ainda falhou</text>

  <text x="20" y="270" class="cap" style="font-size:11px">contorno espesso = estado terminal (sem transição de saída)</text>
</svg>
