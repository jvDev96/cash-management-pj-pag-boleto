<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 190" role="img" aria-label="Cinco caixas em fila: Frontend React, API REST, Saga Orchestrator, RabbitMQ com tres servicos simulados, e Postgres. Uma seta separada de scheduler de timeout aponta para o Orchestrator.">
  <style>
    text{font-family:'IBM Plex Mono','Courier New',monospace;fill:#211D16;}
    .box{fill:#EAE3D0;stroke:#D7CDB2;stroke-width:1.5;}
    .box-accent{fill:#EAE3D0;stroke:#B5661E;stroke-width:1.5;}
    .lbl{font-size:12.5px;font-weight:600;}
    .path{stroke:#211D16;fill:none;}
    .path-warn{stroke:#9C7A1E;fill:none;}
    .lane-sub{fill:#6E6656;font-size:10px;font-family:'IBM Plex Sans',Arial,sans-serif;}
  </style>
  <rect width="1040" height="190" fill="#F2EEE2"/>
  <defs>
    <marker id="m1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#211D16"/></marker>
  </defs>
  <rect x="10" y="50" width="150" height="60" rx="8" class="box"/>
  <text x="85" y="76" text-anchor="middle" class="lbl">Frontend</text>
  <text x="85" y="92" text-anchor="middle" class="lane-sub">React + TS · 3 páginas</text>

  <line x1="160" y1="80" x2="205" y2="80" class="path" marker-end="url(#m1)"/>

  <rect x="209" y="50" width="140" height="60" rx="8" class="box"/>
  <text x="279" y="76" text-anchor="middle" class="lbl">API REST</text>
  <text x="279" y="92" text-anchor="middle" class="lane-sub">Spring Web</text>

  <line x1="349" y1="80" x2="394" y2="80" class="path" marker-end="url(#m1)"/>

  <rect x="398" y="50" width="160" height="60" rx="8" class="box-accent"/>
  <text x="478" y="76" text-anchor="middle" class="lbl" style="fill:#B5661E">Saga Orchestrator</text>
  <text x="478" y="92" text-anchor="middle" class="lane-sub">decide a transição</text>

  <line x1="558" y1="80" x2="603" y2="80" class="path" marker-end="url(#m1)"/>

  <rect x="607" y="30" width="220" height="100" rx="8" class="box"/>
  <text x="717" y="52" text-anchor="middle" class="lbl">RabbitMQ</text>
  <text x="717" y="67" text-anchor="middle" class="lane-sub">saga.exchange · 8 filas + DLQ</text>
  <text x="625" y="86" class="lane-sub">• Validação Boleto</text>
  <text x="625" y="100" class="lane-sub">• Conta/Saldo</text>
  <text x="625" y="114" class="lane-sub">• Liquidação</text>

  <line x1="827" y1="80" x2="872" y2="80" class="path" marker-end="url(#m1)"/>

  <rect x="876" y="50" width="150" height="60" rx="8" class="box"/>
  <text x="951" y="76" text-anchor="middle" class="lbl">Postgres</text>
  <text x="951" y="92" text-anchor="middle" class="lane-sub">Saga + SagaTransicao</text>

  <line x1="478" y1="130" x2="478" y2="160" class="path-warn" marker-end="url(#m1)"/>
  <text x="478" y="178" text-anchor="middle" class="lane-sub" style="fill:#9C7A1E">SagaTimeoutScheduler — polling a cada 10s, dispara transição por inatividade (RNF03)</text>
</svg>
