spring.application.name=boleto-saga-backend

# DECISAO: aponta pro Postgres subido via docker-compose.yml (raiz do repo)
# PORQUE: as credenciais aqui precisam bater exatamente com POSTGRES_DB/
#         POSTGRES_USER/POSTGRES_PASSWORD definidos la
spring.datasource.url=jdbc:postgresql://localhost:5432/boleto_saga
spring.datasource.username=boleto_saga
spring.datasource.password=boleto_saga

# DECISAO: ddl-auto=update (Hibernate cria/atualiza as tabelas sozinho a
# partir das entidades @Entity, sem precisar escrever SQL de schema)
# PORQUE: acelera o dia a dia deste case. E uma decisao CONSCIENTE de
#         dev-only: numa aplicacao real de producao isso seria substituido
#         por uma ferramenta de migration versionada (ex: Flyway), porque
#         "o Hibernate decide o schema sozinho" e perigoso com dado real.
spring.jpa.hibernate.ddl-auto=update
# show-sql=true so pra fase de aprendizado: deixa visivel no console
# exatamente o SQL que o Hibernate está rodando por baixo dos panos.
spring.jpa.show-sql=true

# DECISAO: open-in-view=false (o Spring liga isso por padrao)
# PORQUE: open-in-view mantem a conexao com o banco presa durante toda
#         a requisicao HTTP, nao so durante a consulta - serve pra telas
#         server-side (JSP/Thymeleaf) buscarem dado a mais na hora de
#         renderizar. Numa API REST isso so segura conexao do pool sem
#         necessidade e pode esconder N+1 query. Desligar e padrao em
#         API REST.
spring.jpa.open-in-view=false

# DECISAO: credenciais do RabbitMQ batem com docker-compose.yml
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=boleto_saga
spring.rabbitmq.password=boleto_saga

# DECISAO: ack manual em vez do automatico (padrao do Spring)
# PORQUE: no modo automatico, o Spring confirma a mensagem sozinho se o
# listener nao lancar excecao - sem espaco pra logica explicita de "isso
# deu certo, confirma" vs "isso falhou, manda pra DLQ". Ack manual da esse
# controle pro codigo do listener (channel.basicAck / basicNack).
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# DECISAO: valores baixos (30s / verifica a cada 10s) de proposito.
# PORQUE: e um valor de DEMONSTRACAO - precisa ser curto o suficiente pra
# voce mostrar o timeout acontecendo ao vivo num video, sem esperar minutos.
# Numa aplicacao real isso seria calibrado pelo SLA de cada integracao
# externa (ex: o SPB pode ter um tempo de resposta esperado bem maior).
saga.timeout.segundos=30
saga.timeout.intervalo-verificacao-ms=10000
